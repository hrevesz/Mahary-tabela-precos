name: Atualizar cotação do ouro

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília, de segunda a sexta
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar cotação do dia
        run: python scripts/fetch_gold_price.py

      - name: Commitar se mudou
        run: |
          git config user.name "mahary-bot"
          git config user.email "bot@mahary.local"
          git add cotacao.json
          git diff --cached --quiet || git commit -m "Atualiza cotação do ouro ($(date -u +%Y-%m-%d))"
          git push

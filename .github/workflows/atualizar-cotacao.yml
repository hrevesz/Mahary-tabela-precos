name: Atualizar cotação do ouro

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília, de segunda a sexta
    - cron: "0 11 * * 1-5"
    # Segundo disparo (13:00 BRT): os agendamentos do GitHub atrasam horas e a
    # fonte (bullion-rates) às vezes ainda não publicou a cotação do dia no
    # primeiro. Sem mudança na fonte, o job não commita nada.
    - cron: "0 16 * * 1-5"
    # A fonte só publica a linha do dia DEPOIS do fechamento (a de 05/11 não
    # existia às 18:36 BRT). Disparos tardios, de terça a sábado (UTC), pegam
    # o fechamento do dia útil anterior antes da Action do Midas (09:30 UTC).
    - cron: "0 2 * * 2-6"
    - cron: "0 8 * * 2-6"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar cotação do dia
        run: python scripts/fetch_gold_price.py

      - name: Commitar se mudou
        run: |
          git config user.name "mahary-bot"
          git config user.email "bot@mahary.local"
          git add cotacao.json
          git diff --cached --quiet || git commit -m "Atualiza cotação do ouro ($(date -u +%Y-%m-%d))"
          # Se alguém mudou o repo manualmente entre o checkout e este ponto
          # (ex.: upload direto no site do GitHub), o push abaixo seria
          # rejeitado ("fetch first"). Para evitar isso, puxamos o que
          # mudou no remoto e reaplicamos nosso commit por cima antes de
          # empurrar. Se não houver nada para commitar, estes comandos
          # são inofensivos.
          git pull --rebase origin main
          git push
